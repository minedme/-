spring:
  profiles:
    active: dev,local
  application:
    name: zhsx-backend

server:
  port: 8081
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/zhsx?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    # 数据库密码：请勿提交真实密码。通过环境变量 DB_PASSWORD 或 application-local.yml（已被 .gitignore 排除）配置
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.qq.com
    port: 587
    # 邮箱账号与 SMTP 授权码：通过环境变量 MAIL_USERNAME / MAIL_PASSWORD 或 application-local.yml 配置
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  # 生产环境请通过环境变量 JWT_SECRET 覆盖此开发占位符
  secret: ${JWT_SECRET:zhsx-dev-jwt-secret-change-me-0123456789abcdef}
  expiration: 86400000

logging:
  level:
    com.zhsx: debug
